<!DOCTYPE html>
<html>

<!-- head avec boostrap, lien vers le css, titre, favicon et javascript -->
<head>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/styleformulairereponse.CSS" />
	<link rel="icon" type="image/png" href="../images/favicon.ico">
    <title>Réponses</title>

	<!-- javascript -->	
    <script>

		// fonction pour répondre quelque chose de différent si la personne aime les chats et si elle ne les aime pas
      	function repondre(aimerleschats) {
        const responseDiv = document.getElementById("aimerleschats");

        if (aimerleschats === "oui") {
          responseDiv.textContent =
            "Incroyableeeeeee, tu fais partie de la tier liste des gens super stylés !!!!!! ";
        } else if (aimerleschats === "non") {
          responseDiv.textContent =
            "TU ES TROP NASEEEEEEEEEEEEEEEEEEE !!!!!!!!! ";
        } else {
          responseDiv.textContent =
            "Réponse non reconnue. Essaie oui ou non !";
        }
      }

	  // Récupérer les infos de mon questionnaire qui ont été enregistrées grâce à la méthode get
      document.addEventListener("DOMContentLoaded", () => {
        // Récupérer les paramètres get de ma page principale
        const urlParams = new URLSearchParams(window.location.search);
        const aimerleschats = urlParams.get("aimerleschats");
        const pourquoi = urlParams.get("pourquoi");
        const nombrechat = urlParams.get("nombrechat");
        const nom = urlParams.get("nom");
        const nourriture = urlParams.get("nourriture");
        const amoureux = urlParams.get("amoureux");
        const chatons = urlParams.get("chatons");

        // Appeler la fonction plus haut pour afficher une réponse en fonction de aimerleschats
        repondre(aimerleschats);

        // Afficher les réponses intégrées dans des phrases
        document.getElementById("result").innerHTML = `
			<p><strong>Est-ce que vous aimez les chats :</strong> ${aimerleschats}</p>
			<p><strong>Parce que </strong> ${pourquoi} <strong>.</strong></p>
			<p><strong>Vous avez eu </strong> ${nombrechat} <strong>chats.</strong></p>
			<p><strong>Caline a failli s'appeler </strong> ${nom} <strong>, c'était une exellente idée d'ailleurs. </strong></p>
			<p><strong>Elle kiffe la </strong> ${nourriture} <strong>, grâce à la boulangerie.</strong></p>
			<p><strong>Son amoureux s'appelle </strong> ${amoureux}<strong>.</strong></p>
			<p><strong>Elle a eu </strong> ${chatons} <strong>chatons.</strong></p>
		  `;
      });
    </script>
</head>

<!-- body avec header, footer et paragraphes de ma page -->
<body>
	<!-- header avec logo, titre-->
    <header>
      	<div class="header-bar">
        	<img
          	src="../images/logo.jpg"
         	 alt="Logo"
          	style="height: 100px; vertical-align: middle"
        	/>
        	<nav style="display: inline-block; margin-left: 20px">
          		<h1>Vos réponses</h1>
        	</nav>
      	</div>
    </header>
	<!-- paragraphe pour écrire la réponse aux paramètres enregistrés dans le questionnaire : on appelle le javascript plus haut-->
	<p>
		</br>
		</br>
		<div id="aimerleschats"></div>
		</br>
		</br>
		<div id="result"></div>
		</br>
		</br>
		<!--lien vers ma page principale-->
		<a href="travail_projet.html">Retour vers la page de Caline</a>
	</p>

	<!-- bas de page-->
	<footer>
		<p> ======  Camille Vignes  ====== </p>
		<p>Ecole Nationale Supérieure de Cognitique</p>
		<p>Groupe 1</p>
		<p>Merci M. Placin</p>	
	</footer>

</body>
</html>
